<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Sentence Train</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
[hidden]{display:none!important}

/* Layout: one-screen game — score strip on top, the "track" where cars line up in the middle, the depot of word cars below, controls at the bottom. Single daytime look on purpose. */
:root{
  --sky:#E6F1F7;
  --ink:#1D2B3A;
  --muted:#5B6B7C;
  --rail:#7A5A43;
  --car:#FFC63D;
  --car-edge:#C98F12;
  --engine:#E5483B;
  --go:#1F9D6B;
  --bad:#D13C2F;
  --paper:#FFFFFF;
  --slot:#B7C9D6;
  --display:"Fredoka", "Arial Rounded MT Bold", "Trebuchet MS", sans-serif;
  --body:"Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  color-scheme: light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;background:var(--sky);color:var(--ink);font-family:var(--body);font-size:16px;
  padding-left:max(16px, env(safe-area-inset-left, 0px));
  padding-right:max(16px, env(safe-area-inset-right, 0px));
  padding-block:16px;
}
.wrap{max-width:1100px;margin:0 auto;display:flex;flex-direction:column;gap:18px;min-height:100%}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
h1{font-family:var(--display);font-weight:700;font-size:clamp(24px,3.6vw,38px);margin:0;letter-spacing:.2px;display:flex;align-items:center;gap:10px}
h1 small{font-family:var(--body);font-size:.45em;color:var(--muted);font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.stats{display:flex;gap:10px;flex-wrap:wrap}
.chip{background:var(--paper);border:2px solid var(--slot);border-radius:999px;padding:6px 14px;font-weight:700;font-variant-numeric:tabular-nums;display:flex;gap:6px;align-items:center}
.chip b{font-family:var(--display);font-size:20px}
.star{color:var(--car-edge)}

/* progress rail */
.progress{height:10px;border-radius:5px;background:var(--slot);overflow:hidden}
.progress i{display:block;height:100%;width:0;background:var(--go);transition:width .4s}

.prompt{font-size:18px;color:var(--muted);margin:0}
.prompt strong{color:var(--ink)}

/* track */
.track{
  position:relative;background:var(--paper);border-radius:18px;padding:22px 18px 34px;
  min-height:150px;display:flex;flex-wrap:wrap;align-items:flex-end;gap:14px 8px;
  box-shadow:0 2px 0 var(--slot);
}
.track::after{ /* rails */
  content:"";position:absolute;left:18px;right:18px;bottom:16px;height:6px;
  background:repeating-linear-gradient(90deg,var(--rail) 0 14px,transparent 14px 22px),var(--rail);
  background-size:auto,100% 2px;background-repeat:repeat-x,no-repeat;background-position:0 0,0 100%;
  border-radius:3px;opacity:.55
}
.engine{width:76px;height:64px;flex:none;display:grid;place-items:center;margin-bottom:-6px}
.engine svg{width:76px;height:64px;overflow:visible}
.puff{fill:#C9D6DF;opacity:0;transform-box:fill-box;transform-origin:center;animation:puff 2.4s ease-out infinite}
.puff.p2{animation-delay:.8s}.puff.p3{animation-delay:1.6s}
@keyframes puff{0%{opacity:0;transform:translate(0,0) scale(.4)}20%{opacity:.9}100%{opacity:0;transform:translate(10px,-22px) scale(1.6)}}
.track{overflow:hidden}
.slot{min-width:70px;height:58px;border:3px dashed var(--slot);border-radius:12px;flex:none}
.track.done .car,.track.done .engine{animation:depart 1.6s cubic-bezier(.55,0,.85,.4) forwards}
.track.done .puff{animation-duration:.6s}
@keyframes depart{0%{transform:translateX(0)}12%{transform:translateX(6px)}100%{transform:translateX(-130vw)}}

/* cars (word tiles) */
.car{
  font-family:var(--display);font-weight:600;font-size:clamp(20px,2.6vw,28px);
  background:var(--car);color:var(--ink);border:3px solid var(--car-edge);
  border-radius:12px;padding:8px 16px;min-height:58px;min-width:58px;cursor:pointer;
  position:relative;box-shadow:0 4px 0 var(--car-edge);transition:transform .12s, opacity .2s;
  touch-action:manipulation;
}
.car::before,.car::after{ /* wheels */
  content:"";position:absolute;bottom:-12px;width:14px;height:14px;border-radius:50%;
  background:var(--ink);border:3px solid var(--paper)
}
.car::before{left:12px}.car::after{right:12px}
.car:hover{transform:translateY(-2px)}
.car:active{transform:translateY(2px);box-shadow:0 2px 0 var(--car-edge)}
.car:focus-visible{outline:4px solid var(--go);outline-offset:3px}
.car.punct{min-width:72px;padding:8px 18px}
.car.punct::before{left:7px}.car.punct::after{right:7px}
.car.wrong{background:#FFD9D4;border-color:var(--bad);box-shadow:0 4px 0 var(--bad);animation:shake .35s}
.car.right{background:#CDEFDF;border-color:var(--go);box-shadow:0 4px 0 var(--go)}
.car.used{visibility:hidden}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}

.depot{display:flex;flex-wrap:wrap;gap:22px 12px;justify-content:center;padding:10px 0 18px;min-height:90px}

.controls{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.btn{
  font-family:var(--display);font-weight:600;font-size:20px;border-radius:14px;padding:12px 22px;
  border:3px solid var(--ink);background:var(--paper);color:var(--ink);cursor:pointer;min-height:52px;
}
.btn:focus-visible{outline:4px solid var(--go);outline-offset:3px}
.btn.primary{background:var(--go);border-color:var(--go);color:#fff}
.btn.big{font-size:24px;padding:14px 30px}
.btn:disabled{opacity:.45;cursor:not-allowed}

.feedback{min-height:64px;text-align:center;font-family:var(--display);font-size:clamp(20px,2.8vw,28px);font-weight:600}
.feedback .ok{color:var(--go)}
.feedback .no{color:var(--bad)}
.feedback .sentence{display:block;font-family:var(--body);font-size:20px;color:var(--ink);font-weight:700;margin-top:4px}

/* start / end panels */
.panel{background:var(--paper);border-radius:22px;padding:28px 24px;display:flex;flex-direction:column;gap:18px;align-items:center;text-align:center;box-shadow:0 3px 0 var(--slot)}
.panel h2{font-family:var(--display);font-size:clamp(28px,4.5vw,44px);margin:0;text-wrap:balance}
.panel p{margin:0;font-size:18px;color:var(--muted);max-width:60ch}
.choices{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.choices .btn[aria-pressed="true"]{background:var(--car);border-color:var(--car-edge)}
.demo{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;pointer-events:none;padding-bottom:12px}
.big-score{font-family:var(--display);font-size:clamp(48px,9vw,88px);font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.missed{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:8px;text-align:left;width:100%;max-width:640px}
.missed li{background:var(--sky);border-radius:12px;padding:10px 14px;font-size:17px}
.missed li span{display:block;color:var(--muted);font-size:14px}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
@media (max-width:520px){.slot{min-width:48px}.engine,.engine svg{width:56px;height:48px}.btn{font-size:18px;padding:10px 16px}}

.login{max-width:520px;margin:0 auto;width:100%}
.login input{
  font-family:var(--display);font-size:28px;padding:12px 16px;border-radius:14px;border:3px solid var(--slot);
  width:100%;text-align:center;color:var(--ink);background:var(--paper)
}
.login input:focus{outline:none;border-color:var(--go)}
.err{color:var(--bad);font-weight:700;min-height:24px;margin:0}
.who{display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:center}
.badge{font-family:var(--display);font-weight:700;background:var(--car);border:3px solid var(--car-edge);border-radius:10px;padding:2px 12px}
.mystats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;width:100%;max-width:560px}
.mystats div{background:var(--sky);border-radius:14px;padding:12px 8px;display:flex;flex-direction:column;gap:2px}
.mystats b{font-family:var(--display);font-size:32px;font-variant-numeric:tabular-nums}
.mystats span{color:var(--muted);font-size:14px}
.linkbtn{background:none;border:0;color:var(--muted);text-decoration:underline;cursor:pointer;font-size:15px;font-family:var(--body)}
.tabs{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.tabs .btn[aria-selected="true"]{background:var(--car);border-color:var(--car-edge)}
.board{list-style:none;margin:0;padding:0;width:100%;max-width:560px;display:flex;flex-direction:column;gap:6px;text-align:left}
.board li{display:grid;grid-template-columns:44px 1fr auto;align-items:center;gap:10px;background:var(--sky);border-radius:12px;padding:10px 14px;font-size:18px}
.board li.me{background:#FFF0C2;outline:3px solid var(--car-edge)}
.board .rk{font-family:var(--display);font-weight:700;font-size:22px;text-align:center;font-variant-numeric:tabular-nums}
.board li:nth-child(1) .rk{color:#C98F12}.board li:nth-child(2) .rk{color:#7D8C99}.board li:nth-child(3) .rk{color:#A0613A}
.board .nm{font-weight:700;min-width:0;overflow-wrap:anywhere}
.board .val{font-family:var(--display);font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.board .val small{font-family:var(--body);color:var(--muted);font-weight:400;font-size:14px;margin-left:6px}
.note{font-size:14px;color:var(--muted)}
.save{font-weight:700}
.save.ok{color:var(--go)}.save.no{color:var(--bad)}
</style>
</head>
<body>
<div class="wrap" id="app">
  <header>
    <h1>Sentence Train <small id="lvlTag">句子重組</small></h1>
    <div class="stats" id="stats" hidden>
      <span class="chip">題目 <b id="qnum">1</b>/<b id="qtotal">10</b></span>
      <span class="chip">這回合 <span class="star" aria-hidden="true">★</span> <b id="stars">0</b></span>
      <span class="chip">我的星星 <span class="star" aria-hidden="true">★</span> <b id="wallet">0</b></span>
    </div>
  </header>

  <!-- login -->
  <section class="panel login" id="login">
    <div class="demo" aria-hidden="true">
      <span class="car">Hello</span><span class="car punct">!</span>
    </div>
    <h2>What's your English name?</h2>
    <p>輸入你的英文名字就可以開始玩。</p>
    <form id="loginForm" style="display:flex;flex-direction:column;gap:12px;width:100%">
      <label for="nameInput" class="note">英文名字</label>
      <input id="nameInput" autocomplete="off" autocapitalize="words" spellcheck="false" placeholder="例如 Amy" maxlength="30">
      <p class="err" id="loginErr" aria-live="polite"></p>
      <button class="btn primary big" type="submit">進入</button>
    </form>
  </section>

  <!-- home -->
  <section class="panel" id="home" hidden>
    <div class="who"><h2 id="hello">Hi!</h2><span class="badge" id="myLevel">H5</span></div>
    <div class="mystats">
      <div><b id="myTotal">0</b><span>我的星星</span></div>
      <div><b id="myBest">–</b><span>單回合最佳</span></div>
      <div><b id="myRounds">0</b><span>玩過幾回合</span></div>
    </div>
    <p>每回合 10 題。點單字車廂排成正確的句子，第一次就答對得一顆星。卡住的時候可以用 10 顆星換一個提示。</p>
    <div class="controls">
      <button class="btn primary big" id="go">開始玩</button>
      <button class="btn big" id="toBoard">排行榜</button>
    </div>
    <button class="linkbtn" id="logout">不是你？換人登入</button>
  </section>

  <!-- game -->
  <section id="game" hidden style="display:flex;flex-direction:column;gap:18px">
    <div class="progress" aria-hidden="true"><i id="bar"></i></div>
    <p class="prompt">Unscramble and make a sentence. <strong>點車廂排成句子</strong></p>
    <div class="track" id="track" aria-label="你的句子"></div>
    <div class="feedback" id="fb" aria-live="polite"></div>
    <div class="depot" id="depot" aria-label="單字車廂"></div>
    <div class="controls">
      <button class="btn" id="clear">全部拿回</button>
      <button class="btn" id="hint">提示 −10<span class="star">★</span></button>
      <button class="btn primary" id="check">檢查</button>
      <button class="btn primary" id="next" hidden>下一題 →</button>
    </div>
  </section>

  <!-- end -->
  <section class="panel" id="end" hidden>
    <h2>全部到站了！</h2>
    <div class="big-score"><span class="star">★</span> <span id="final">0</span><span style="font-size:.45em;color:var(--muted)"> / 10</span></div>
    <p id="endTime"></p>
    <p class="save" id="saveMsg" aria-live="polite"></p>
    <p id="endMsg"></p>
    <ul class="missed" id="missed"></ul>
    <div class="controls">
      <button class="btn primary" id="again">再玩一回合</button>
      <button class="btn" id="endBoard">看排行榜</button>
      <button class="btn" id="retryMissed" hidden>練習錯的題目（不計分）</button>
    </div>
  </section>

  <!-- leaderboard -->
  <section class="panel" id="boardPanel" hidden>
    <h2 id="boardTitle">H5 排行榜</h2>
    <div class="tabs" role="tablist" aria-label="排名方式">
      <button class="btn" role="tab" id="tabTotal" aria-selected="true">星星最多</button>
      <button class="btn" role="tab" id="tabBest" aria-selected="false">單回合最佳</button>
    </div>
    <div class="tabs" role="tablist" aria-label="範圍">
      <button class="btn" role="tab" id="scopeMine" aria-selected="true">我的班</button>
      <button class="btn" role="tab" id="scopeAll" aria-selected="false">同級全部</button>
    </div>
    <p class="note" id="boardNote"></p>
    <ol class="board" id="board"></ol>
    <button class="btn" id="boardBack">回到首頁</button>
  </section>
</div>

const $ = id => document.getElementById(id);
const joinWords = arr => arr.join(" ").replace(/ ([.?!,])/g, "$1").replace(/\s+/g, " ").trim();
const norm = s => s.trim().replace(/\s+/g, " ").toLowerCase();

function solve(words, target){
  const used = words.map(() => false), seq = [];
  let out = null;
  (function bt(){
    if (out) return;
    if (seq.length === words.length){ if (joinWords(seq.map(i => words[i])) === target) out = seq.slice(); return; }
    if (seq.length && !target.startsWith(joinWords(seq.map(i => words[i])))) return;
    for (let k = 0; k < words.length; k++) if (!used[k]){ used[k] = true; seq.push(k); bt(); seq.pop(); used[k] = false; }
  })();
  return out;
}
const SOLS = {}; for (const k in SETS) SOLS[k] = SETS[k].map(it => solve(it.w, it.a[0]).map(i => it.w[i]));
function shuffle(a){ a = a.slice(); for (let i = a.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

/* ---------- storage: Firebase, or a local demo when no config ---------- */
let fsdb = null;
const DEMO = !FIREBASE_CONFIG.projectId;
try { if (!DEMO){ firebase.initializeApp(FIREBASE_CONFIG); fsdb = firebase.firestore(); } } catch (e) { console.error(e); }

function localAll(){ try { return JSON.parse(localStorage.getItem("st_demo") || "{}"); } catch (e) { return {}; } }
function localPut(id, rec){ try { const all = localAll(); all[id] = rec; localStorage.setItem("st_demo", JSON.stringify(all)); } catch (e) {} }

const docId = (lv, name) => lv + "_" + norm(name).replace(/[^a-z0-9]+/g, "-");

async function getPlayer(lv, name){
  const id = docId(lv, name);
  if (fsdb){ const snap = await fsdb.collection(COLLECTION).doc(id).get(); return snap.exists ? snap.data() : null; }
  return localAll()[id] || null;
}
async function saveRound(lv, name, stars, secs){
  const id = docId(lv, name);
  const merge = old => {
    const rec = old ? { ...old } : { name, level: lv, totalStars: 0, rounds: 0, bestStars: -1, bestTime: 0, hintsUsed: 0 };
    if (rec.hintsUsed === undefined) rec.hintsUsed = 0;
    rec.totalStars += stars; rec.rounds += 1;
    if (stars > rec.bestStars || (stars === rec.bestStars && secs < rec.bestTime)){ rec.bestStars = stars; rec.bestTime = secs; }
    return rec;
  };
  if (fsdb){
    const ref = fsdb.collection(COLLECTION).doc(id);
    let rec;
    await fsdb.runTransaction(async tx => {
      const snap = await tx.get(ref);
      rec = merge(snap.exists ? snap.data() : null);
      rec.updatedAt = firebase.firestore.FieldValue.serverTimestamp();
      tx.set(ref, rec);
    });
    return rec;
  }
  const rec = merge(localAll()[id]); localPut(id, rec); return rec;
}
// spend 10 stars for one hint; resolves with the new star count, rejects "not_enough" when short
async function spendHint(lv, name){
  const id = docId(lv, name);
  const apply = old => {
    if (!old || old.totalStars < HINT_COST) throw new Error("not_enough");
    return { ...old, totalStars: old.totalStars - HINT_COST, hintsUsed: (old.hintsUsed || 0) + 1 };
  };
  if (fsdb){
    const ref = fsdb.collection(COLLECTION).doc(id);
    let rec;
    await fsdb.runTransaction(async tx => {
      const snap = await tx.get(ref);
      rec = apply(snap.exists ? snap.data() : null);
      rec.updatedAt = firebase.firestore.FieldValue.serverTimestamp();
      tx.set(ref, rec);
    });
    return rec.totalStars;
  }
  const rec = apply(localAll()[id]); localPut(id, rec); return rec.totalStars;
}
async function getBoard(classes){
  if (fsdb){ const qs = await fsdb.collection(COLLECTION).where("level", "in", classes).get(); return qs.docs.map(d => d.data()); }
  return Object.values(localAll()).filter(r => classes.includes(r.level));
}

function startGame(order, practice){
  state.practice = !!practice;
  state.order = order || shuffle([...ITEMS.keys()]).slice(0, ROUND_SIZE);
  state.idx = 0; state.stars = 0; state.missed = []; state.start = Date.now();
  show("game");
  $("qtotal").textContent = state.order.length;
  $("wallet").textContent = wallet;
  loadQuestion();
}
function loadQuestion(){
  const qi = state.order[state.idx];
  state.placed = []; state.tries = 0; state.solved = false;
  let pool = shuffle(ITEMS[qi].w.map((w, i) => ({ w, id: i })));
  if (ITEMS[qi].a.includes(joinWords(pool.map(p => p.w)))) pool = pool.reverse();
  state.pool = pool;
  $("qnum").textContent = state.idx + 1;
  $("stars").textContent = state.stars;
  $("bar").style.width = (state.idx / state.order.length * 100) + "%";
  $("fb").innerHTML = "";
  $("next").hidden = true; $("check").hidden = false; $("check").disabled = true;
  $("hint").disabled = false; $("clear").disabled = false;
  render();
}
function render(){
  const qi = state.order[state.idx], n = ITEMS[qi].w.length;
  const track = $("track"); track.classList.remove("done");
  track.innerHTML = ENGINE;
  state.placed.forEach((tile, pos) => {
    const b = document.createElement("button");
    b.className = "car" + (/^[.?!,]$/.test(tile.w) ? " punct" : "") + (tile.mark ? " " + tile.mark : "");
    b.textContent = tile.w;
    b.setAttribute("aria-label", tile.w + "，點一下拿回車站");
    b.onclick = () => { if (state.solved) return; state.placed.splice(pos, 1); clearMarks(); render(); };
    track.appendChild(b);
  });
  for (let k = state.placed.length; k < n; k++){ const s = document.createElement("span"); s.className = "slot"; track.appendChild(s); }
  const depot = $("depot"); depot.innerHTML = "";
  state.pool.forEach(tile => {
    const b = document.createElement("button");
    const used = state.placed.some(p => p.id === tile.id);
    b.className = "car" + (/^[.?!,]$/.test(tile.w) ? " punct" : "") + (used ? " used" : "");
    b.textContent = tile.w; b.disabled = used || state.solved;
    b.onclick = () => { clearMarks(); state.placed.push({ w: tile.w, id: tile.id }); render(); if (state.placed.length === n) $("check").focus(); };
    depot.appendChild(b);
  });
  $("check").disabled = state.placed.length !== n || state.solved;
}
function clearMarks(){ state.placed.forEach(p => delete p.mark); if (!state.solved) $("fb").innerHTML = ""; }

function check(){
  const qi = state.order[state.idx], it = ITEMS[qi], sol = SOL[qi];
  const said = joinWords(state.placed.map(p => p.w));
  state.tries++;
  if (it.a.includes(said)){
    state.solved = true;
    const first = state.tries === 1;
    if (first) state.stars++; else state.missed.push(qi);
    state.placed.forEach(p => p.mark = "right");
    render();
    $("fb").innerHTML = `<span class="ok">${first ? "答對了！ ★ +1" : "答對了！"}</span><span class="sentence"></span>`;
    $("fb").querySelector(".sentence").textContent = said;
    $("stars").textContent = state.stars;
    $("check").hidden = true; $("next").hidden = false; $("next").focus();
    $("hint").disabled = true; $("clear").disabled = true;
    speak(said);
    setTimeout(() => $("track").classList.add("done"), 700);
  } else {
    state.placed.forEach((p, i) => p.mark = p.w === sol[i] ? "right" : "wrong");
    render();
    const ok = state.placed.filter(p => p.mark === "right").length;
    $("fb").innerHTML = `<span class="no">再試一次！</span><span class="sentence" style="font-weight:400;color:var(--muted)">綠色的位置對了（${ok}/${sol.length}），把紅色的車廂點回去重排。</span>`;
  }
}
function hint(){
  if (state.solved) return;
  if (wallet < HINT_COST){
    $("fb").innerHTML = `<span class="sentence" style="font-weight:400;color:var(--muted)">要有 ${HINT_COST} 顆星才能換提示，你現在有 ${wallet} 顆。玩完一回合，星星就會存進來！</span>`;
    return;
  }
  $("fb").innerHTML = `<span class="sentence" style="font-weight:400;color:var(--muted)">要用 ${HINT_COST} 顆星換一個提示嗎？用了提示這題就沒有星星喔。</span>
    <span class="controls" style="margin-top:10px"><button class="btn primary" id="hintYes">用 ${HINT_COST}★ 換提示</button><button class="btn" id="hintNo">先不要</button></span>`;
  $("hintNo").onclick = () => { $("fb").innerHTML = ""; };
  $("hintYes").onclick = async () => {
    $("hintYes").disabled = true; $("hintNo").disabled = true;
    try {
      wallet = await spendHint(me.level, me.name);
      $("wallet").textContent = wallet;
      giveHint();
    } catch (e) {
      console.error(e);
      $("fb").innerHTML = `<span class="no" style="font-size:20px">${e.message === "not_enough" ? "星星不夠，沒辦法換提示。" : "提示沒有換成功，請檢查網路再試一次。"}</span>`;
    }
  };
}
function giveHint(){
  const qi = state.order[state.idx], sol = SOL[qi];
  clearMarks();
  let k = 0; while (k < state.placed.length && state.placed[k].w === sol[k]) k++;
  state.placed = state.placed.slice(0, k);
  if (k < sol.length){
    const tile = state.pool.find(t => t.w === sol[k] && !state.placed.some(p => p.id === t.id));
    state.placed.push({ w: tile.w, id: tile.id, mark: "right" });
  }
  state.tries = Math.max(state.tries, 1);
  render();
  $("fb").innerHTML = `<span class="sentence" style="font-weight:400;color:var(--muted)">花了 ${HINT_COST} 顆星：前 ${state.placed.length} 個車廂已經排好了。</span>`;
}
function next(){ state.idx++; if (state.idx >= state.order.length) return finish(); loadQuestion(); }

async function finish(){
  show("end");
  const secs = Math.round((Date.now() - state.start) / 1000);
  $("final").textContent = state.stars;
  $("endTime").textContent = "花了 " + Math.floor(secs / 60) + " 分 " + (secs % 60) + " 秒";
  const pct = state.stars / state.order.length;
  $("endMsg").textContent = state.missed.length === 0 ? "全部第一次就答對，太厲害了！" : "下面是需要再練習的句子：";
  const ul = $("missed"); ul.innerHTML = "";
  state.missed.forEach(qi => { const li = document.createElement("li"); li.textContent = ITEMS[qi].a[0]; const sp = document.createElement("span"); sp.textContent = ITEMS[qi].w.join(" / "); li.appendChild(sp); ul.appendChild(li); });
  $("retryMissed").hidden = state.missed.length === 0;
  const msg = $("saveMsg");
  if (state.practice){ msg.className = "save"; msg.textContent = "這是錯題練習，不列入排行榜。"; return; }
  msg.className = "save"; msg.textContent = "正在記錄分數…";
  try {
    const rec = await saveRound(me.level, me.name, state.stars, secs);
    wallet = rec.totalStars;
    msg.className = "save ok";
    msg.textContent = "分數已記錄！你現在有 " + rec.totalStars + " 顆星" + (DEMO ? "（示範模式，只存在這台電腦）" : "");
  } catch (e) {
    console.error(e);
    msg.className = "save no"; msg.textContent = "分數沒有存到，請檢查網路後再玩一次。";
  }
}

function speak(text){
  try { if (!("speechSynthesis" in window)) return; const u = new SpeechSynthesisUtterance(text); u.lang = "en-US"; u.rate = .9; speechSynthesis.cancel(); speechSynthesis.speak(u); } catch (e) {}
}

/* ---------- leaderboard ---------- */
let boardMode = "total", boardScope = "mine";
async function openBoard(){
  show("boardPanel");
  
  await drawBoard();
}
async function drawBoard(){
  $("tabTotal").setAttribute("aria-selected", boardMode === "total");
  $("tabBest").setAttribute("aria-selected", boardMode === "best");
  $("scopeMine").setAttribute("aria-selected", boardScope === "mine");
  $("scopeAll").setAttribute("aria-selected", boardScope === "all");
  const lv = CLASS_LEVEL[me.level];
  const classes = boardScope === "mine" ? [me.level] : Object.keys(CLASS_LEVEL).filter(c => CLASS_LEVEL[c] === lv && c !== "Teacher");
  $("boardTitle").textContent = boardScope === "mine" ? (me.level === "Teacher" ? "老師排行榜" : me.level + " 班排行榜") : lv + " 學生全部排行榜";
  $("boardNote").textContent = boardMode === "total" ? "現在擁有的星星（用提示會扣掉 10 顆），越常練習越前面。" : "玩得最好的那一回合；星星一樣多時，比較快的排前面。";
  const ol = $("board"); ol.innerHTML = '<li><span class="rk"></span><span class="nm">載入中…</span><span></span></li>';
  let rows;
  try { rows = await getBoard(classes); } catch (e) { console.error(e); ol.innerHTML = '<li><span class="rk"></span><span class="nm">排行榜讀不到，請檢查網路。</span><span></span></li>'; return; }
  rows = rows.filter(r => boardMode === "total" ? r.totalStars > 0 || r.rounds > 0 : r.bestStars >= 0);
  rows.sort(boardMode === "total" ? (a, b) => b.totalStars - a.totalStars || b.rounds - a.rounds : (a, b) => b.bestStars - a.bestStars || a.bestTime - b.bestTime);
  ol.innerHTML = "";
  if (!rows.length){ ol.innerHTML = '<li><span class="rk"></span><span class="nm">還沒有人上榜，快來當第一名！</span><span></span></li>'; return; }
  let rank = 0, prev = null;
  rows.forEach((r, i) => {
    const key = boardMode === "total" ? r.totalStars : r.bestStars + "_" + r.bestTime;
    if (key !== prev){ rank = i + 1; prev = key; }
    const li = document.createElement("li");
    if (norm(r.name) === norm(me.name) && r.level === me.level) li.className = "me";
    const rk = document.createElement("span"); rk.className = "rk"; rk.textContent = rank;
    const nm = document.createElement("span"); nm.className = "nm"; nm.textContent = r.name + (boardScope === "all" ? "（" + r.level + "）" : "");
    const val = document.createElement("span"); val.className = "val";
    if (boardMode === "total"){ val.textContent = "★ " + r.totalStars; const sm = document.createElement("small"); sm.textContent = r.rounds + " 回合"; val.appendChild(sm); }
    else { val.textContent = "★ " + r.bestStars + "/10"; const sm = document.createElement("small"); sm.textContent = Math.floor(r.bestTime / 60) + ":" + String(r.bestTime % 60).padStart(2, "0"); val.appendChild(sm); }
    li.append(rk, nm, val); ol.appendChild(li);
  });
}

$("endBoard").onclick = openBoard;
$("boardBack").onclick = goHome;
$("tabTotal").onclick = () => { boardMode = "total"; drawBoard(); };
$("tabBest").onclick = () => { boardMode = "best"; drawBoard(); };
$("scopeMine").onclick = () => { boardScope = "mine"; drawBoard(); };
$("scopeAll").onclick = () => { boardScope = "all"; drawBoard(); };
$("check").onclick = check;
$("hint").onclick = hint;
$("clear").onclick = () => { if (state.solved) return; state.placed = []; clearMarks(); render(); };
$("next").onclick = next;
$("again").onclick = () => startGame();
$("retryMissed").onclick = () => startGame(shuffle(state.missed), true);

// remember who logged in on this device
(function(){
  let saved = null;
  try { saved = JSON.parse(localStorage.getItem("st_me") || "null"); } catch (e) {}
  const st = saved && findStudent(saved.name);
  if (st) login(st); else show("login");
})();
</script>
</body>
